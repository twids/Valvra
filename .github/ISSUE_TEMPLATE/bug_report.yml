name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: "Report security vulnerabilities privately. Never include credentials, private keys, connection strings or database dumps."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Valvra version or commit
  - type: input
    id: environment
    attributes:
      label: Windows / IIS / database versions
