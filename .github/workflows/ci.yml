name: build-and-security-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:security
      - run: npm run test:accessibility
      - name: Password import and hierarchy mapping
        timeout-minutes: 5
        run: npm run test:import
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: accessibility-results
          path: |
            artifacts/accessibility-report
            artifacts/accessibility-results
            artifacts/import-browser-results
  databases:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Valvra_CI_${{ github.run_id }}_Aa!
        ports: ["1433:1433"]
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: Valvra_CI_${{ github.run_id }}_Aa!
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Valvra.slnx
      - name: Wait for disposable SQL Server
        env:
          SQLSERVER_ID: ${{ job.services.sqlserver.id }}
        run: |
          for attempt in $(seq 1 30); do
            if docker exec "$SQLSERVER_ID" bash -c '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Test both providers and INSERT-only audit permissions
        env:
          # Synthetic credentials exist only in this job's disposable containers.
          VALVRA_TEST_SQLSERVER: Server=localhost;Database=master;User Id=sa;Password=Valvra_CI_${{ github.run_id }}_Aa!;Encrypt=true;TrustServerCertificate=true
          VALVRA_TEST_POSTGRESQL: Host=localhost;Database=postgres;Username=postgres;Password=Valvra_CI_${{ github.run_id }}_Aa!;SSL Mode=Disable
        run: dotnet test Valvra.slnx -c Release --no-restore --settings tests/coverage.runsettings --collect:"Code Coverage" --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - name: Client security regression tests
        run: node --test tests/browser/*.test.cjs
      - name: Security coverage floor
        shell: pwsh
        run: ./tests/Assert-SecurityCoverage.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: database-test-results
          path: artifacts/test-results
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Valvra.slnx
      - run: dotnet test Valvra.slnx -c Release --no-restore --settings tests/coverage.runsettings --collect:"Code Coverage" --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - name: Client security regression tests
        run: node --test tests/browser/*.test.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-security-test-results
          path: artifacts/test-results
      - name: Publish Windows IIS package
        # Production packages must never include the public demo or test identity.
        run: dotnet publish src/Valvra.Web -c Release -r win-x64 --self-contained false -o artifacts/publish
      - name: Verify production package isolation
        shell: pwsh
        run: |
          $unexpected = Get-ChildItem artifacts/publish -File -Recurse |
            Where-Object { $_.Name -match 'Valvra\.(Demo|Tests|Preview)|Sqlite' }
          if ($unexpected) { throw "Demo or test implementation leaked into the production package." }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valvra-windows-iis
          path: artifacts/publish
