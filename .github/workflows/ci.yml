name: build-and-security-tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  databases:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Valvra_CI_${{ github.run_id }}_Aa!
        ports: ["1433:1433"]
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: Valvra_CI_${{ github.run_id }}_Aa!
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Valvra.slnx
      - name: Wait for disposable SQL Server
        env:
          SQLSERVER_ID: ${{ job.services.sqlserver.id }}
        run: |
          for attempt in $(seq 1 30); do
            if docker exec "$SQLSERVER_ID" bash -c '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Test both providers and INSERT-only audit permissions
        env:
          # Synthetic credentials exist only in this job's disposable containers.
          VALVRA_TEST_SQLSERVER: Server=localhost;Database=master;User Id=sa;Password=Valvra_CI_${{ github.run_id }}_Aa!;Encrypt=true;TrustServerCertificate=true
          VALVRA_TEST_POSTGRESQL: Host=localhost;Database=postgres;Username=postgres;Password=Valvra_CI_${{ github.run_id }}_Aa!;SSL Mode=Disable
        run: dotnet test Valvra.slnx -c Release --no-restore --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: database-test-results
          path: tests/Valvra.Tests/TestResults/*.trx
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Valvra.slnx
      - run: dotnet test Valvra.slnx -c Release --no-restore
      - name: Publish Windows IIS package
        run: dotnet publish src/Valvra.Web -c Release -r win-x64 --self-contained false -o artifacts/publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: valvra-windows-iis
          path: artifacts/publish
